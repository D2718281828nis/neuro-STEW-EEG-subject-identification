[project]
name = "neuro-stew-eeg-subject-identification"
version = "0.1.0"
description = "STEW EEG subject-identification, GAT, and KuramotoGNN modeling pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Shared by every pipeline (window/channel/band config, feature-table plumbing, plots).
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
gat = []
kuramotognn = [
    "torch>=2.0",
]
subject-ident = [
    "antropy>=0.2",
    "keras>=3.0",
    "tensorflow>=2.15",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
# Everything needed to run all three pipelines and the full test/lint suite.
all = [
    "neuro-stew-eeg-subject-identification[gat,kuramotognn,subject-ident,dev]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["eeg_config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: reduced synthetic end-to-end smoke test that runs a full pipeline",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
